name: "Terraform Azure Plan Pipeline"

on:
  pull_request:
    branches:
      - main

# Enforce secure modern OpenID Connect (OIDC) tokens for passwordless Azure logins
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform_plan:
    name: "Azure Cloud Execution Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Step 3: Authenticate securely into your company's Azure Cloud tenant using OIDC
      - name: Authenticate to Microsoft Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 4: Run a true initialization that links up to your active Azure remote state bucket
      - name: Initialize Production Backend
        run: |
          cd environments/prod
          terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true

      # Step 5: Generate a secure cloud resource execution preview plan
      - name: Generate Cloud Plan Preview
        id: plan
        run: |
          cd environments/prod
          terraform plan -no-color -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
